<text x="70" y="534" font-size="11">D21.3: energy of an eccentric orbit (e = 0.9) for three step sizes. Check of the engine against</text>
<text x="70" y="550" font-size="11">mathematics, reference law L0.</text>
<text x="70" y="566" font-size="11">Largest swing 3.7e-06, 3.3e-07, 3.7e-08; change at the end at most 7.5e-09.</text>
<text x="70" y="582" font-size="11">The swing happens at the closest approach and comes back. Decision D21 asks for both numbers.</text>
