<svg xmlns="http://www.w3.org/2000/svg" width="640" height="588" font-family="sans-serif" font-size="12">
<rect width="640" height="588" fill="white"/>
<text x="70" y="534" font-size="11">T9.1: under the hypothesis L1a (lambda = 1) a neutron would respond as a charge of 9.009e-19 e.</text>
<text x="70" y="550" font-size="11">Measurement check: the measured charge is (-0.2 +/- 0.8)e-21 e (as cited by the book), so L1a at</text>
<text x="70" y="566" font-size="11">this strength is excluded, and lambda must be below 0.0020.</text>
<line x1="70" y1="450.0" x2="620" y2="450.0" stroke="#444"/>
<text x="70" y="40">size of the neutron's effective charge</text>
<rect x="80.0" y="133.3" width="141.3" height="316.7" fill="#c0392b"/>
<text x="150.7" y="128.3" text-anchor="middle">900.9</text>
<text x="150.7" y="466" text-anchor="middle">L1a, lambda = 1</text>
<rect x="256.7" y="449.4" width="141.3" height="1.0" fill="#1f4e9c"/>
<text x="327.3" y="444.4" text-anchor="middle">1.8</text>
<text x="327.3" y="466" text-anchor="middle">measured limit (2 standard errors)</text>
<text x="239.0" y="486" text-anchor="middle" font-weight="bold">in units of 1e-21 e</text>
</svg>
