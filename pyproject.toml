# Package definition of the engine (task P1, docs/WORK-PLAN.md).
# The runtime dependencies repeat the pinned environment of requirements.txt
# (decision D13). If you change a pin, change it in both files.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmicmass"
dynamic = ["version"]
description = "Engine of the Cosmic Mass Lab: a virtual universe made only of cosmic masses (mu = m + qG)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mostafa Derraz" }]
dependencies = [
    "sympy==1.14.0",
    "mpmath==1.3.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "jsonschema==4.26.0",  # P4, decision D24 (proposed): validates results; the engine does not import it
    "ruff==0.17.5",  # P7, decision D24 (proposed): lint
]

[project.urls]
Repository = "https://github.com/MostafaDerraz/cosmic-mass-lab"

[tool.setuptools.packages.find]
where = ["engine"]
include = ["cosmicmass*"]

[tool.setuptools.dynamic]
version = { attr = "cosmicmass.__version__" }

[tool.ruff]
# Task P7. verification/ and sources/ are never edited by contributors (AGENTS.md), so they are not linted.
line-length = 120
target-version = "py312"
extend-exclude = ["verification", "sources"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors and warnings, bugbear: errors and likely bugs, not taste.
select = ["E4", "E7", "E9", "F", "W", "B"]
# zip(strict=...) is a style choice for the many paired loops of the tests
ignore = ["B905"]

[tool.ruff.format]
# Configured, not yet enforced in CI: a first `ruff format .` would rewrite about 36 files and
# conflict with every open pull request. Decision D25 (proposed); team/notes/P7.md.
quote-style = "double"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["engine/tests", "engine/gates"]
addopts = "-ra -m 'not slow'"
markers = ["slow: long runs, excluded by default; run them with: pytest -m slow"]
