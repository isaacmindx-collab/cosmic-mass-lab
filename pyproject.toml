# Package definition of the engine (task P1, docs/WORK-PLAN.md).
# The runtime dependencies repeat the pinned environment of requirements.txt
# (decision D13). If you change a pin, change it in both files.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cosmicmass"
dynamic = ["version"]
description = "Engine of the Cosmic Mass Lab: a virtual universe made only of cosmic masses (mu = m + qG)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mostafa Derraz" }]
dependencies = [
    "sympy==1.14.0",
    "mpmath==1.3.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "jsonschema==4.26.0",  # P4: tools/validate_results.py and its tests (decision D24)
    "ruff==0.17.5",
    # D34: tools/build_journal.py (the Co-exist Journal) and its test
    "markdown==3.8.2",
    "pymdown-extensions==10.16.1",
    "pyyaml==6.0.2",
]

[project.urls]
Repository = "https://github.com/MostafaDerraz/cosmic-mass-lab"

[tool.setuptools.packages.find]
where = ["engine"]
include = ["cosmicmass*"]

[tool.setuptools.dynamic]
version = { attr = "cosmicmass.__version__" }

[tool.ruff]
# Task P7. verification/ and sources/ are never edited by contributors (AGENTS.md), so they are not linted.
line-length = 120
target-version = "py312"
extend-exclude = ["verification", "sources"]

[tool.ruff.lint]
# pyflakes, pycodestyle errors and warnings, bugbear: errors and likely bugs, not taste.
select = ["E4", "E7", "E9", "F", "W", "B"]
# zip(strict=...) is a style choice for the many paired loops of the tests
ignore = ["B905"]

[tool.ruff.format]
# Decision D25: one pass of `ruff format .` (2026-11-14), then `ruff format --check .` in CI.
# Markdown is not formatted: the code blocks of ARCHITECTURE.md and the notes are written by hand.
quote-style = "double"
exclude = ["*.md"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["engine/tests", "engine/gates"]
addopts = "-ra -m 'not slow'"
markers = ["slow: long runs, excluded by default; run them with: pytest -m slow"]
