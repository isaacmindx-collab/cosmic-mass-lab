name: Verify formulas

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  architecture:
    # Rule D18. Pull requests: the whole pull request must update ARCHITECTURE.md
    # if it changes code. Pushes to main: the same for the pushed range.
    # Pushes to work branches: only the static checks (registry, diagrams),
    # because a single follow-up commit may fix code without touching the
    # architecture; the pull request check covers the whole change.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Architecture in step with the code (rule D18)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            python tools/check_architecture.py --base "origin/$BASE_REF"
          elif [ "$REF" = "refs/heads/main" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            python tools/check_architecture.py --base "$BEFORE"
          else
            python tools/check_architecture.py
          fi

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned environment
        run: pip install -r requirements.txt

      - name: Cosmic Mass paper (106 checks)
        working-directory: verification/cosmic-mass
        run: python verify_cmt.py ../../sources/cosmic-mass-paper

      - name: General Numbers paper (204 checks)
        working-directory: verification/general-numbers
        run: python verify_paper.py "../../sources/general-numbers-paper/General Numbers.tex"

      - name: Book algebra (253 checks)
        working-directory: verification/general-numbers/book-algebra
        run: python verify_general_number_algebra.py

      - name: Book laws (144 laws)
        working-directory: verification/general-numbers/book-laws-test
        run: python test_general_number_laws.py

      - name: Gazette version (9,304 checks)
        working-directory: verification/general-numbers/gazette-version
        run: python check_gazette.py

      - name: General Sinus revision 3 (79 checks)
        working-directory: verification/general-sinus
        run: python verify_gsp.py

  lint:
    # Task P7: ruff, with the settings and the pinned version of pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned ruff
        run: |
          PIN=$(python -c "import tomllib; dev = tomllib.load(open('pyproject.toml', 'rb'))['project']['optional-dependencies']['dev']; print(next(d for d in dev if d.startswith('ruff')))")
          echo "installing $PIN"
          pip install "$PIN"

      - name: Ruff lint
        run: ruff check . --output-format=github

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the engine with its dev extras
        run: pip install -e ".[dev]"

      - name: Unit tests with coverage (fails under 90%)
        run: pytest --cov=cosmicmass --cov-report=term-missing --cov-fail-under=90
